<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>IMAIOS Anatomy Quiz — Membre Supérieur</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-panel: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg-app: #0b1120;
      --bg-panel: #111827;
      --bg-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================
       1. ULTRA-COMPACT TOPBAR
       ========================================== */
    .topbar {
      padding-top: var(--safe-top);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 40;
      flex-shrink: 0;
    }

    .topbar-inner {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 6px;
    }

    .nav-slice-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-btn:active {
      background: var(--primary);
      color: #fff;
    }

    .slice-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .slice-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slice-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .score-badge {
      background: var(--success-soft);
      color: #059669;
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }
    [data-theme="dark"] .score-badge {
      color: #34d399;
    }

    .settings-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .settings-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ==========================================
       2. GIANT ANATOMICAL STAGE (MAXIMIZED SPACE)
       ========================================== */
    .stage-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      touch-action: none;
      cursor: grab;
    }

    .stage-wrapper.is-panning {
      cursor: grabbing;
    }

    #anatomy-svg {
      width: 100%;
      height: 100%;
      display: block;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* SVG POINTS & TARGET MARKER */
    .anat-point-group {
      cursor: pointer;
    }

    .anat-point-hit {
      fill: transparent;
      r: 22px;
    }

    .anat-point-outer {
      r: 6px;
      stroke: #0f172a;
      stroke-width: 1.8px;
      transition: r 0.15s, stroke-width 0.15s, opacity 0.15s;
    }

    .anat-point-inner {
      r: 2.2px;
      fill: #0f172a;
      pointer-events: none;
    }

    .anat-point-group.faded {
      opacity: 0.35;
    }

    .anat-point-group.done-ok .anat-point-outer {
      fill: #10b981 !important;
      stroke: #064e3b;
      r: 5.5px;
    }

    .anat-point-group.done-ko .anat-point-outer {
      fill: #ef4444 !important;
      stroke: #7f1d1d;
      r: 5.5px;
    }

    @keyframes pulseRing {
      0% { r: 10px; stroke-opacity: 0.95; stroke-width: 4px; }
      100% { r: 28px; stroke-opacity: 0; stroke-width: 1px; }
    }

    .target-pulse-ring {
      fill: none;
      stroke: #2563eb;
      pointer-events: none;
      animation: pulseRing 1.4s infinite ease-out;
    }

    .target-leader-line {
      stroke: #2563eb;
      stroke-width: 2.8;
      stroke-dasharray: 5 3;
      pointer-events: none;
    }

    .target-callout-group {
      cursor: grab;
      touch-action: none;
    }

    .target-callout-group.dragging {
      cursor: grabbing;
    }

    .target-callout-pill {
      fill: rgba(15, 23, 42, 0.94);
      stroke: #38bdf8;
      stroke-width: 2.2;
      rx: 10;
      ry: 10;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
      transition: fill 0.2s, stroke 0.2s;
    }

    .target-callout-pill.success {
      fill: #064e3b;
      stroke: #34d399;
      stroke-width: 2.8;
      filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.65));
    }

    .target-callout-pill.wrong-reveal {
      fill: #450a0a;
      stroke: #f87171;
      stroke-width: 2.8;
      filter: drop-shadow(0 0 14px rgba(239, 68, 68, 0.55));
    }

    @keyframes scoreBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.28); background: #10b981; color: #ffffff; box-shadow: 0 0 16px rgba(16, 185, 129, 0.6); }
      100% { transform: scale(1); }
    }

    .score-badge.pop {
      animation: scoreBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* FLOATING PRAISE TOAST */
    .praise-toast {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%) scale(0.7);
      z-index: 35;
      pointer-events: none;
      opacity: 0;
      padding: 7px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.35);
      white-space: nowrap;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease;
    }

    .praise-toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .target-callout-text {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      pointer-events: none;
    }

    .target-callout-subtext {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 10.5px;
      font-style: italic;
      font-weight: 500;
      fill: #93c5fd;
      text-anchor: middle;
      pointer-events: none;
    }

    .target-callout-grip {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #64748b;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* FLOATING ZOOM BAR */
    .zoom-toolbar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 22;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-level-badge {
      padding: 0 6px;
      font-size: 11px;
      font-weight: 700;
      color: #f8fafc;
      min-width: 40px;
      text-align: center;
      cursor: pointer;
    }

    /* PROGRESS PILL OVERLAY TOP-LEFT */
    .progress-pill {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 22;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .progress-cat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid #fff;
    }

    /* ==========================================
       3. COMPACT ONE-BY-ONE QUESTION DOCK (BOTTOM)
       ========================================== */
    .question-dock {
      position: relative;
      padding-bottom: var(--safe-bottom);
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      z-index: 30;
      flex-shrink: 0;
      box-shadow: 0 -4px 18px rgba(15, 23, 42, 0.08);
    }

    .dock-timer-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3.5px;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }

    .dock-timer-bar {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      background: linear-gradient(90deg, #10b981, #38bdf8);
    }

    .dock-timer-bar.wrong {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    .dock-inner {
      padding: 10px 12px;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dock-prompt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .dock-prompt-text {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    .dock-prompt-sub {
      display: block;
      font-size: 11px;
      font-weight: 500;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .dock-actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .dock-skip-btn {
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dock-pace-chip {
      border: 1px solid var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dock-pause-btn {
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dock-pause-btn.paused {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
    }
    [data-theme="dark"] .dock-pause-btn.paused {
      color: #fbbf24;
    }

    .dock-next-btn {
      border: none;
      background: var(--primary);
      color: #ffffff;
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.32);
    }

    .dock-next-btn.success {
      background: #10b981;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35);
    }

    /* QCM 2x2 COMPACT GRID */
    .qcm-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    @media (max-width: 520px) {
      .qcm-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .qcm-btn {
      padding: 9px 10px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
      min-height: 42px;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qcm-btn:active {
      transform: scale(0.96);
    }

    @keyframes qcmCorrectPop {
      0% { transform: scale(0.95); }
      45% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes qcmWrongShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .qcm-btn.correct {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      border-color: #34d399 !important;
      color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.42);
      animation: qcmCorrectPop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qcm-btn.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #991b1b;
      animation: qcmWrongShake 0.3s ease;
    }
    [data-theme="dark"] .qcm-btn.wrong { color: #fca5a5; }

    /* FLASHCARD MODE (1 QUESTION AT A TIME: REVEAL -> JUSTE / FAUX) */
    .flashcard-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      min-height: 48px;
    }

    .flashcard-answer {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .flashcard-fr {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .flashcard-la {
      font-size: 11px;
      font-style: italic;
      color: var(--text-muted);
    }

    .flashcard-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .fc-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: none;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fc-btn.reveal {
      background: var(--primary);
      color: #fff;
      width: 100%;
      justify-content: center;
    }

    .fc-btn.ok {
      background: var(--success);
      color: #fff;
    }

    .fc-btn.ko {
      background: var(--danger);
      color: #fff;
    }

    /* ==========================================
       4. SETTINGS & FILTERS MODAL DRAWER
       ========================================== */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-sheet {
      background: var(--bg-panel);
      width: min(560px, 100%);
      max-height: 86dvh;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
    }

    .drawer-close {
      border: none;
      background: var(--bg-subtle);
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .drawer-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .drawer-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .drawer-select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .mode-card {
      padding: 9px 10px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-card.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .presets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-chip {
      border: 1px dashed var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .cats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cat-pill {
      border: 1.5px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0.55;
    }

    .cat-pill.active {
      opacity: 1;
      background: var(--bg-panel);
      color: var(--text-main);
      border-color: var(--cat-color, var(--primary));
    }

    .cat-pill.empty {
      display: none;
    }

    .cat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.25);
    }

    .thumb-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 2px;
      -webkit-overflow-scrolling: touch;
    }

    .thumb-item {
      width: 48px;
      height: 50px;
      border-radius: 8px;
      border: 2px solid var(--border);

      font-size: 8.5px;
      font-weight: 700;
      padding: 0 3px;
      border-radius: 3px;
    }
  </style>
</head>

        <button class="settings-btn" id="btn-reset-quiz" style="flex:1;justify-content:center;height:38px;">🔄 Recommencer cette coupe</button>
        <button class="settings-btn" id="btn-theme" style="height:38px;">🌙 Thème</button>
      </div>

  <script src="data/imaios_msk_all.js"></script>
  <script>
    (function () {
      const MODULES = window.IMAIOS_MSK_MODULES;
      if (!MODULES) return;

      const CATEGORY_META = {
        N: { label: "Nerfs", color: "#FBE94F", icon: "⚡" },
        A: { label: "Artères", color: "#FF0000", icon: "🩸" },
        V: { label: "Veines", color: "#52BBFE", icon: "💧" },
        M: { label: "Muscles", color: "#FE6137", icon: "💪" },
        T: { label: "Tendons", color: "#CEE9F6", icon: "🪢" },
        F: { label: "Fascias & Bourses", color: "#D8F0F0", icon: "🛡️" },
        O: { label: "Os", color: "#E6D9C4", icon: "🦴" },
        E: { label: "Articulations", color: "#66FFFF", icon: "⚙️" },
        L: { label: "Ligaments", color: "#CCFF32", icon: "🔗" },
        G: { label: "Lymphatiques", color: "#86EFAC", icon: "🟢" },
        P: { label: "Régions", color: "#CBD5E1", icon: "🗺️" }
      };

      let savedPace = "confort";
      try {
        const p = localStorage.getItem("anat_advance_pace");
        if (p && ["confort", "long", "manuel", "rapide"].includes(p)) savedPace = p;
      } catch (_) {}

      const state = {
        currentModuleKey: "ms",
        currentSeriesId: 243,
        currentSliceId: 8019,
        activeCategories: new Set(["N", "A", "V"]),
        mode: "qcm",
        advancePace: savedPace,
        pointStatus: {},
        quizQueue: [],
        currentTargetPointId: null,
        flashcardRevealed: false,
        fcAnswered: false,
        pinAnswered: false,
        qcmOptions: [],
        qcmAnswered: false,
        lastAnswerCorrect: false,
        lastAnswerWrong: false,
        advancePaused: false,
        userCalloutPos: null,
        scoreOk: 0,
        scoreTotal: 0,
        streak: 0,
        didPan: false
      };

      // ==========================================
      // SATISFYING AUDIO, HAPTICS & CONFETTI BURST
      // ==========================================
      let audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playSuccessChime(streakCount) {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          // Pitch climbs slightly with streak for extra dopamine!
          const pitchMult = 1 + Math.min(streakCount - 1, 8) * 0.035;
          const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 - E5 - G5 - C6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === notes.length - 1 ? "triangle" : "sine";
            osc.frequency.setValueAtTime(freq * pitchMult, now + idx * 0.055);
            gain.gain.setValueAtTime(0.001, now + idx * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.055 + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.055 + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 0.34);
          });
        } catch (_) {}
      }

      function playErrorThud() {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(125, now + 0.18);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } catch (_) {}
      }

      let praiseTimer = null;
      function showPraiseToast(streakCount, labelFr) {
        const toast = document.getElementById("praise-toast");
        if (!toast) return;
        const praises = ["✨ Exact !", "🎯 Bien joué !", "⚡ Nickel !", "👏 Parfait !"];
        const base = praises[Math.floor(Math.random() * praises.length)];
        const shortLabel = labelFr && labelFr.length <= 28 ? ` • ${labelFr}` : "";
        if (streakCount >= 10) {
          toast.textContent = `👑 Série x${streakCount} — Légendaire !`;
        } else if (streakCount >= 5) {
          toast.textContent = `🔥 Série x${streakCount} — Imparable !`;
        } else if (streakCount >= 2) {
          toast.textContent = `🔥 Série x${streakCount} • ${base}`;
        } else {
          toast.textContent = `${base}${shortLabel}`;
        }
        toast.classList.add("show");
        if (praiseTimer) clearTimeout(praiseTimer);
        praiseTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2400);
      }

      function spawnSvgSuccessBurst(pt) {
        if (!pt || !elSvg) return;
        const ns = "http://www.w3.org/2000/svg";
        const g = document.createElementNS(ns, "g");
        g.setAttribute("pointer-events", "none");

        // 1. Expanding emerald + gold shockwave rings
        ["#10b981", "#fbbf24"].forEach((color, idx) => {
          const ring = document.createElementNS(ns, "circle");
          ring.setAttribute("cx", String(pt.x));
          ring.setAttribute("cy", String(pt.y));
          ring.setAttribute("r", "8");
          ring.setAttribute("fill", "none");
          ring.setAttribute("stroke", color);
          ring.setAttribute("stroke-width", idx === 0 ? "4" : "2.5");
          g.appendChild(ring);
          if (ring.animate) {
            ring.animate(
              [
                { r: "8px", strokeOpacity: 1, strokeWidth: idx === 0 ? "4.5px" : "3px" },
                { r: idx === 0 ? "58px" : "42px", strokeOpacity: 0, strokeWidth: "0.5px" }
              ],
              { duration: 580, delay: idx * 70, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "forwards" }
            );
          }
        });

        // 2. 18 celebratory particles flying outward from the anatomical point
        const colors = ["#10b981", "#34d399", "#fbbf24", "#38bdf8", "#a3e635", "#f472b6"];
        const count = 18;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
          const dist = 28 + Math.random() * 44;
          const dx = Math.cos(angle) * dist;
          const dy = Math.sin(angle) * dist;
          const dot = document.createElementNS(ns, "circle");
          dot.setAttribute("cx", String(pt.x));
          dot.setAttribute("cy", String(pt.y));
          dot.setAttribute("r", String(3.2 + Math.random() * 2.5));
          dot.setAttribute("fill", colors[i % colors.length]);
          g.appendChild(dot);
          if (dot.animate) {
            dot.animate(
              [
                { transform: "translate(0px, 0px) scale(1)", opacity: 1 },
                { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(0.1)`, opacity: 0 }
              ],
              { duration: 560 + Math.random() * 180, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "forwards" }
            );
          }
        }

        elSvg.appendChild(g);
        setTimeout(() => {
          if (g.parentNode) g.parentNode.removeChild(g);
        }, 800);
      }

      function celebrateCorrectAnswer(targetPt) {
        state.scoreOk++;
        state.streak++;
        state.lastAnswerCorrect = true;
        state.lastAnswerWrong = false;
        if (navigator.vibrate) navigator.vibrate([18, 35, 30]);
        playSuccessChime(state.streak);
        showPraiseToast(state.streak, targetPt ? targetPt.labelFr : "");
        elScoreBadge.classList.remove("pop");
        void elScoreBadge.offsetWidth;
        elScoreBadge.classList.add("pop");
        renderSvgStage();
        if (targetPt) spawnSvgSuccessBurst(targetPt);
      }

      function registerWrongAnswer() {
        state.streak = 0;
        state.lastAnswerCorrect = false;
        state.lastAnswerWrong = true;
        if (navigator.vibrate) navigator.vibrate(40);
        playErrorThud();
      }

      // ==========================================
      // POST-VALIDATION TIMER & AUTO-PAUSE CONTROL
      // ==========================================
      let advanceTimer = null;
      let advanceCountdownInterval = null;
      let timerBarAnim = null;
      const elTimerBar = document.getElementById("dock-timer-bar");

      const PACE_LABELS = {
        confort: "⏱️ Délai: 5s",
        long: "🐢 Délai: 8s",
        manuel: "✋ Manuel",
        rapide: "⚡ Délai: 2s"
      };
      const PACE_ORDER = ["confort", "manuel", "long", "rapide"];

      function getPaceShortLabel() {
        return PACE_LABELS[state.advancePace] || PACE_LABELS.confort;
      }

      function syncPaceButtonsUI() {
        document.querySelectorAll("#pace-grid [data-pace]").forEach(b => {
          b.classList.toggle("active", b.getAttribute("data-pace") === state.advancePace);
        });
        const chip = document.getElementById("btn-cycle-pace");
        if (chip) chip.textContent = getPaceShortLabel();
      }

      function cycleAdvancePace() {
        const idx = PACE_ORDER.indexOf(state.advancePace);
        state.advancePace = PACE_ORDER[(idx + 1) % PACE_ORDER.length];
        try {
          localStorage.setItem("anat_advance_pace", state.advancePace);
        } catch (_) {}
        syncPaceButtonsUI();
        if (isQuestionValidated()) {
          scheduleAdvance(state.lastAnswerCorrect);
        }
      }

      function isQuestionValidated() {
        return Boolean(state.qcmAnswered || state.pinAnswered || state.fcAnswered);
      }

      function clearAdvanceTimer() {
        if (advanceTimer) {
          clearTimeout(advanceTimer);
          advanceTimer = null;
        }
        if (advanceCountdownInterval) {
          clearInterval(advanceCountdownInterval);
          advanceCountdownInterval = null;
        }
        if (timerBarAnim) {
          timerBarAnim.cancel();
          timerBarAnim = null;
        }
        if (elTimerBar) {
          elTimerBar.style.transform = "scaleX(0)";
          elTimerBar.classList.remove("wrong");
        }
        state.advancePaused = false;
      }

      function pauseAdvanceTimer() {
        if (!isQuestionValidated()) return;
        if (advanceTimer) {
          clearTimeout(advanceTimer);
          advanceTimer = null;
        }
        if (advanceCountdownInterval) {
          clearInterval(advanceCountdownInterval);
          advanceCountdownInterval = null;
        }
        if (timerBarAnim) {
          timerBarAnim.cancel();
          timerBarAnim = null;
        }
        if (elTimerBar) {
          elTimerBar.style.transform = "scaleX(0)";
        }
        state.advancePaused = true;
        const btnPause = document.getElementById("btn-pause-advance");
        if (btnPause) {
          btnPause.textContent = "⏸ Figé";
          btnPause.classList.add("paused");
        }
        const btnNext = document.getElementById("btn-next-q");
        if (btnNext) {
          btnNext.textContent = "Suivant →";
        }
      }

      function getAdvanceDelayMs(isCorrect) {
        switch (state.advancePace) {
          case "manuel":
            return 0;
          case "long":
            return isCorrect ? 8000 : 10000;
          case "rapide":
            return isCorrect ? 2000 : 3000;
          case "confort":
          default:
            return isCorrect ? 5000 : 6500;
        }
      }

      function scheduleAdvance(isCorrect) {
        clearAdvanceTimer();
        const delayMs = getAdvanceDelayMs(isCorrect);
        const btnNext = document.getElementById("btn-next-q");
        const btnPause = document.getElementById("btn-pause-advance");

        if (delayMs <= 0) {
          state.advancePaused = true;
          if (btnPause) {
            btnPause.textContent = "✋ Manuel";
            btnPause.classList.add("paused");
          }
          if (btnNext) {
            btnNext.textContent = "Question suivante →";
          }
          return;
        }

        const deadline = Date.now() + delayMs;
        const updateBtnCountdown = () => {
          const b = document.getElementById("btn-next-q");
          if (!b || state.advancePaused) return;
          const remSec = Math.max(1, Math.ceil((deadline - Date.now()) / 1000));
          b.textContent = `Suivant (${remSec}s) →`;
        };
        updateBtnCountdown();
        advanceCountdownInterval = setInterval(updateBtnCountdown, 250);

        if (elTimerBar) {
          elTimerBar.classList.toggle("wrong", !isCorrect);
          if (elTimerBar.animate) {
            timerBarAnim = elTimerBar.animate(
              [{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }],
              { duration: delayMs, easing: "linear", fill: "forwards" }
            );
          }
        }

        advanceTimer = setTimeout(() => {
          advanceTimer = null;
          if (advanceCountdownInterval) {
            clearInterval(advanceCountdownInterval);
            advanceCountdownInterval = null;
          }
          advanceQuestion();
        }, delayMs);
      }

      function getActiveModule() {
        return MODULES[state.currentModuleKey] || MODULES.ms;
      }

      // Helper to wrap long anatomical labels cleanly into multiple lines without any truncation
      function wrapTextLines(str, maxCharsPerLine) {
        const text = String(str || "").trim();
        if (!text) return [];
        if (text.length <= maxCharsPerLine) return [text];
        const words = text.split(/\s+/);
        const lines = [];
        let current = "";
        words.forEach(word => {
          if (!current) {
            current = word;
          } else if ((current + " " + word).length <= maxCharsPerLine) {
            current += " " + word;
          } else {
            lines.push(current);
            current = word;
          }
        });
        if (current) lines.push(current);
        return lines;
      }

      // Convert client (screen) coordinates into SVG coordinates accurately under any zoom/pan
      function clientToSvgCoords(clientX, clientY) {
        const pt = elSvg.createSVGPoint();
        pt.x = clientX;
        pt.y = clientY;
        const ctm = elSvg.getScreenCTM();
        if (!ctm) return { x: 320, y: 335 };
        const transformed = pt.matrixTransform(ctm.inverse());
        return { x: transformed.x, y: transformed.y };
      }

      // DOM Elements
      const elSliceTitle = document.getElementById("slice-title-display");
      const elSliceSub = document.getElementById("slice-sub-display");
      const elScoreBadge = document.getElementById("score-badge");
      const elProgressDot = document.getElementById("progress-cat-dot");
      const elProgressText = document.getElementById("progress-text");
      const elSvg = document.getElementById("anatomy-svg");
      const elDockInner = document.getElementById("dock-inner");
      const elDrawerBackdrop = document.getElementById("drawer-backdrop");
      const elSeriesSelect = document.getElementById("series-select");
      const elCatChips = document.getElementById("category-chips-container");
      const elThumbStrip = document.getElementById("thumb-strip");

      function getSeriesSlices(seriesId) {
        const DATA = getActiveModule();
        if (seriesId === 0) return DATA.slices;
        return DATA.slices.filter(s => s.series_id === seriesId);
      }

      function getCurrentSlice() {
        const DATA = getActiveModule();
        return DATA.slices.find(s => s.id === state.currentSliceId) || DATA.slices[0];
      }

      function getFilteredPoints(slice) {
        return slice.points.filter(p => state.activeCategories.has(p.category));
      }

      function ensureNonEmptyCategoriesForSlice(slice) {
        const hasAny = slice.points.some(p => state.activeCategories.has(p.category));
        if (!hasAny && slice.points.length > 0) {
          slice.points.forEach(p => state.activeCategories.add(p.category));
        }
      }

      function initSeriesDropdown() {
        const DATA = getActiveModule();
        elSeriesSelect.innerHTML = "";
        const optAll = document.createElement("option");
        optAll.value = "0";
        optAll.textContent = `Toutes les séries — ${DATA.name} (${DATA.slices.length} planches)`;
        elSeriesSelect.appendChild(optAll);

        DATA.series.forEach(ser => {
          const opt = document.createElement("option");
          opt.value = String(ser.id);
          opt.textContent = `${ser.name} (${ser.number_of_images})`;
          if (ser.id === state.currentSeriesId) opt.selected = true;
          elSeriesSelect.appendChild(opt);
        });
      }

      elSeriesSelect.addEventListener("change", () => {
        state.currentSeriesId = Number(elSeriesSelect.value);
        const slices = getSeriesSlices(state.currentSeriesId);
        if (slices.length > 0) selectSlice(slices[0].id, true);
      });

      function initSliceQuizState() {
        clearAdvanceTimer();
        const slice = getCurrentSlice();
        ensureNonEmptyCategoriesForSlice(slice);
        const pts = getFilteredPoints(slice);
        state.pointStatus = {};
        state.userCalloutPos = null;
        state.lastAnswerCorrect = false;
        state.lastAnswerWrong = false;
        state.pinAnswered = false;
        state.fcAnswered = false;
        pts.forEach(p => { state.pointStatus[p.id] = "pending"; });

        // Order questions shuffled
        state.quizQueue = pts.map(p => p.id).sort(() => Math.random() - 0.5);
        state.currentTargetPointId = state.quizQueue[0] || null;
        state.flashcardRevealed = false;
        prepareQcmOptions();
      }

      function prepareQcmOptions() {
        const DATA = getActiveModule();
        const slice = getCurrentSlice();
        const targetPt = slice.points.find(p => p.id === state.currentTargetPointId);
        state.qcmAnswered = false;
        state.pinAnswered = false;
        state.fcAnswered = false;
        state.lastAnswerCorrect = false;
        state.lastAnswerWrong = false;
        if (!targetPt) {
          state.qcmOptions = [];
          return;
        }
        // Prefer distractors from the same slice & category first, then global category in module
        const sameSliceCat = [];
        const globalCat = [];
        const seen = new Set([targetPt.labelFr]);

        slice.points.forEach(p => {
          if (p.category === targetPt.category && !seen.has(p.labelFr)) {
            seen.add(p.labelFr);
            sameSliceCat.push(p.labelFr);
          }
        });

        DATA.slices.forEach(s => {
          s.points.forEach(p => {
            if (p.category === targetPt.category && !seen.has(p.labelFr)) {
              seen.add(p.labelFr);
              globalCat.push(p.labelFr);
            }
          });
        });

        const pool = [...sameSliceCat.sort(() => Math.random() - 0.5), ...globalCat.sort(() => Math.random() - 0.5)];
        const distractors = pool.slice(0, 3);
        state.qcmOptions = [targetPt.labelFr, ...distractors].sort(() => Math.random() - 0.5);
      }

      function advanceQuestion() {
        clearAdvanceTimer();
        state.quizQueue = state.quizQueue.filter(id => state.pointStatus[id] === "pending");
        state.currentTargetPointId = state.quizQueue[0] || null;
        state.flashcardRevealed = false;
        state.fcAnswered = false;
        state.pinAnswered = false;
        state.lastAnswerCorrect = false;
        state.lastAnswerWrong = false;
        prepareQcmOptions();
        renderAll();
      }

      // ==========================================
      // RENDER GIANT CLEAN SVG PLATE (ONLY 1 QUESTION HIGHLIGHTED AT A TIME!)
      // ==========================================
      function renderSvgStage() {
        const slice = getCurrentSlice();
        const sliceW = slice.width || 640;
        const sliceH = slice.height || 670;
        elSvg.setAttribute("viewBox", `0 0 ${sliceW} ${sliceH}`);

        const points = getFilteredPoints(slice);
        const targetPt = points.find(p => p.id === state.currentTargetPointId);

        let svgHtml = `
          <defs>
            <filter id="pt-shadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.45"/>
            </filter>
          </defs>
          <image href="${slice.image}" x="0" y="0" width="${sliceW}" height="${sliceH}" preserveAspectRatio="none" />
        `;

        // 1. Draw anatomical points first so the active legend callout always sits clearly above them
        points.forEach(pt => {
          const isTarget = state.currentTargetPointId === pt.id;
          const status = state.pointStatus[pt.id] || "pending";
          const fillHex = `#${pt.color || "FFFFFF"}`;

          let groupClass = "anat-point-group";
          if (status === "ok") groupClass += " done-ok";
          else if (status === "ko") groupClass += " done-ko";
          else if ((state.mode !== "pin" || state.pinAnswered) && !isTarget) groupClass += " faded";

          const highlightTarget = isTarget && (state.mode !== "pin" || state.pinAnswered);
          const rOuter = highlightTarget ? 8.5 : 6;
          const strokeColor = highlightTarget ? "#2563eb" : "#0f172a";
          const strokeW = highlightTarget ? 3 : 1.8;

          svgHtml += `
            <g class="${groupClass}" data-pt-id="${pt.id}" filter="url(#pt-shadow)">
              <circle class="anat-point-hit" cx="${pt.x}" cy="${pt.y}" />
              <circle class="anat-point-outer" cx="${pt.x}" cy="${pt.y}" fill="${fillHex}" style="r:${rOuter}px;stroke:${strokeColor};stroke-width:${strokeW}px;" />
              <circle class="anat-point-inner" cx="${pt.x}" cy="${pt.y}" />
            </g>
          `;
        });

        // 2. Draw ONLY the leader line and draggable full-text legend for the single active point!
        let calloutBounds = null;
        if (targetPt && (state.mode !== "pin" || state.pinAnswered)) {
          const tx = targetPt.x;
          const ty = targetPt.y;
          const catMeta = CATEGORY_META[targetPt.category] || { label: "Structure" };

          const showAnswerOnPlate =
            state.mode === "study" ||
            (state.mode === "flashcard" && state.flashcardRevealed) ||
            (state.mode === "qcm" && state.qcmAnswered) ||
            (state.mode === "pin" && state.pinAnswered);

          const prefix = state.lastAnswerCorrect ? "✓ " : (state.lastAnswerWrong ? "✗ " : "");
          const mainText = showAnswerOnPlate
            ? `${prefix}${targetPt.labelFr}`
            : `❓ À identifier (${catMeta.label}) — glisser pour déplacer`;
          const subText = (showAnswerOnPlate && targetPt.labelLa) ? targetPt.labelLa : "";

          const mainLines = wrapTextLines(mainText, 34);
          const subLines = subText ? wrapTextLines(subText, 40) : [];

          const maxMainChars = mainLines.reduce((m, l) => Math.max(m, l.length), 0);
          const maxSubChars = subLines.reduce((m, l) => Math.max(m, l.length), 0);
          const contentW = Math.max(maxMainChars * 7.2, maxSubChars * 5.8);
          const boxW = Math.min(sliceW - 20, Math.max(170, Math.ceil(contentW + 44)));

          const mainLineH = 16;
          const subLineH = 14;
          const totalTextH = mainLines.length * mainLineH + (subLines.length > 0 ? subLines.length * subLineH + 4 : 0);
          const boxH = Math.max(34, totalTextH + 16);

          // Determine position: use user-dragged position if available, else smart default offset in margin
          let calloutX, calloutY;
          if (state.userCalloutPos) {
            calloutX = state.userCalloutPos.x;
            calloutY = state.userCalloutPos.y;
          } else {
            calloutY = ty > 150 ? ty - Math.max(82, boxH / 2 + 54) : ty + Math.max(82, boxH / 2 + 54);
            calloutX = tx < sliceW / 2 ? tx + 60 : tx - 60;
          }

          // Clamp inside the sliceW x sliceH SVG canvas so the full text box is never cut off at the edges
          const minX = boxW / 2 + 8;
          const maxX = sliceW - boxW / 2 - 8;
          const minY = boxH / 2 + 8;
          const maxY = sliceH - boxH / 2 - 8;
          calloutX = Math.max(minX, Math.min(maxX, calloutX));
          calloutY = Math.max(minY, Math.min(maxY, calloutY));

          calloutBounds = { tx, ty, boxW, boxH, calloutX, calloutY, sliceW, sliceH, ptId: targetPt.id };

          // Build multi-line SVG <tspan> elements
          let curY = -totalTextH / 2 + mainLineH * 0.78;
          let tspansHtml = "";
          mainLines.forEach(line => {
            tspansHtml += `<text class="target-callout-text" x="6" y="${curY.toFixed(1)}">${escapeHtml(line)}</text>`;
            curY += mainLineH;
          });
          if (subLines.length > 0) {
            curY += 2;
            subLines.forEach(line => {
              tspansHtml += `<text class="target-callout-subtext" x="6" y="${curY.toFixed(1)}">${escapeHtml(line)}</text>`;
              curY += subLineH;
            });
          }

          let pillClass = "target-callout-pill";
          let leaderColor = "#2563eb";
          if (state.lastAnswerCorrect) {
            pillClass = "target-callout-pill success";
            leaderColor = "#10b981";
          } else if (state.lastAnswerWrong) {
            pillClass = "target-callout-pill wrong-reveal";
            leaderColor = "#ef4444";
          }

          svgHtml += `
            <line id="target-leader-line" class="target-leader-line" style="stroke:${leaderColor}" x1="${tx}" y1="${ty}" x2="${calloutX}" y2="${calloutY}" />
            <circle class="target-pulse-ring" style="stroke:${leaderColor}" cx="${tx}" cy="${ty}" r="14" />
            <g id="target-callout-group" class="target-callout-group" transform="translate(${calloutX}, ${calloutY})">
              <rect class="${pillClass}" x="${-boxW / 2}" y="${-boxH / 2}" width="${boxW}" height="${boxH}" />
              <text class="target-callout-grip" x="${-boxW / 2 + 12}" y="0">⠿</text>
              ${tspansHtml}
            </g>
          `;
        }

        elSvg.innerHTML = svgHtml;

        // Attach drag handler to the on-plate callout legend so user can move it freely
        if (calloutBounds) {
          const elCallout = document.getElementById("target-callout-group");
          const elLeader = document.getElementById("target-leader-line");
          if (elCallout && elLeader) {
            let isDraggingCallout = false;
            let dragOffsetX = 0;
            let dragOffsetY = 0;
            let curX = calloutBounds.calloutX;
            let curY = calloutBounds.calloutY;

            const startDrag = (clientX, clientY) => {
              isDraggingCallout = true;
              pauseAdvanceTimer();
              elCallout.classList.add("dragging");
              const svgPt = clientToSvgCoords(clientX, clientY);
              dragOffsetX = curX - svgPt.x;
              dragOffsetY = curY - svgPt.y;
            };

            const moveDrag = (clientX, clientY) => {
              if (!isDraggingCallout) return;
              const svgPt = clientToSvgCoords(clientX, clientY);
              const minX = calloutBounds.boxW / 2 + 6;
              const maxX = calloutBounds.sliceW - calloutBounds.boxW / 2 - 6;
              const minY = calloutBounds.boxH / 2 + 6;
              const maxY = calloutBounds.sliceH - calloutBounds.boxH / 2 - 6;
              curX = Math.max(minX, Math.min(maxX, svgPt.x + dragOffsetX));
              curY = Math.max(minY, Math.min(maxY, svgPt.y + dragOffsetY));
              state.userCalloutPos = { x: curX, y: curY };
              elCallout.setAttribute("transform", `translate(${curX}, ${curY})`);
              elLeader.setAttribute("x2", String(curX));
              elLeader.setAttribute("y2", String(curY));
            };

            const endDrag = () => {
              if (!isDraggingCallout) return;
              isDraggingCallout = false;
              elCallout.classList.remove("dragging");
            };

            elCallout.addEventListener("touchstart", (e) => {
              if (e.touches.length === 1) {
                e.stopPropagation();
                startDrag(e.touches[0].clientX, e.touches[0].clientY);
              }
            }, { passive: false });

            elCallout.addEventListener("touchmove", (e) => {
              if (isDraggingCallout && e.touches.length === 1) {
                e.preventDefault();
                e.stopPropagation();
                moveDrag(e.touches[0].clientX, e.touches[0].clientY);
              }
            }, { passive: false });

            elCallout.addEventListener("touchend", (e) => {
              if (isDraggingCallout) {
                e.stopPropagation();
                endDrag();
              }
            });

            elCallout.addEventListener("mousedown", (e) => {
              if (e.button !== 0) return;
              e.preventDefault();
              e.stopPropagation();
              startDrag(e.clientX, e.clientY);
              const onWinMove = (ev) => moveDrag(ev.clientX, ev.clientY);
              const onWinUp = () => {
                endDrag();
                window.removeEventListener("mousemove", onWinMove);
                window.removeEventListener("mouseup", onWinUp);
              };
              window.addEventListener("mousemove", onWinMove);
              window.addEventListener("mouseup", onWinUp);
            });
          }
        }

        // Clicking any point on the plate:
        // - In 'pin' mode: answers the location quiz!
        // - In 'qcm' / 'flashcard' / 'study' mode: switches the active question to that point!
        elSvg.querySelectorAll("[data-pt-id]").forEach(el => {
          const ptId = Number(el.getAttribute("data-pt-id"));
          el.addEventListener("click", (e) => {
            if (state.didPan) return;
            e.stopPropagation();
            onPointTapped(ptId);
          });
        });
      }

      function onPointTapped(ptId) {
        const slice = getCurrentSlice();
        if (state.mode === "pin") {
          if (!state.currentTargetPointId) return;
          if (state.pinAnswered) return;
          state.scoreTotal++;
          if (ptId === state.currentTargetPointId) {
            state.pinAnswered = true;
            state.pointStatus[ptId] = "ok";
            const targetPt = slice.points.find(p => p.id === ptId);
            celebrateCorrectAnswer(targetPt);
            renderBottomDock();
            scheduleAdvance(true);
          } else {
            registerWrongAnswer();
            state.pointStatus[ptId] = "ko";
            renderAll();
          }
        } else {
          // Allow user to tap any point on the plate to immediately question/inspect that point!
          clearAdvanceTimer();
          state.currentTargetPointId = ptId;
          state.flashcardRevealed = state.mode === "study";
          prepareQcmOptions();
          renderAll();
        }
      }

      // ==========================================
      // RENDER BOTTOM DOCK (1 QUESTION AT A TIME)
      // ==========================================
      function bindPostValidationButtons() {
        const btnPause = document.getElementById("btn-pause-advance");
        const btnNext = document.getElementById("btn-next-q");
        if (btnPause) {
          btnPause.addEventListener("click", () => {
            pauseAdvanceTimer();
          });
        }
        if (btnNext) {
          btnNext.addEventListener("click", () => {
            advanceQuestion();
          });
        }
      }

      function bindPaceChipButton() {
        const btnPace = document.getElementById("btn-cycle-pace");
        if (btnPace) {
          btnPace.addEventListener("click", () => {
            cycleAdvancePace();
          });
        }
      }

      function renderBottomDock() {
        const slice = getCurrentSlice();
        const points = getFilteredPoints(slice);
        const targetPt = points.find(p => p.id === state.currentTargetPointId);
        const doneCount = points.filter(p => state.pointStatus[p.id] !== "pending").length;

        const streakTag = state.streak >= 2 ? ` 🔥${state.streak}` : "";
        elScoreBadge.textContent = `✓ ${state.scoreOk}/${state.scoreTotal}${streakTag}`;

        if (!targetPt) {
          elProgressText.textContent = `Terminé (${points.length}/${points.length})`;
          elDockInner.innerHTML = `
            <div class="flashcard-box">
              <div class="flashcard-answer">
                <div class="flashcard-fr">🎉 Coupe terminée ! (${state.scoreOk}/${state.scoreTotal} bonnes réponses)</div>
                <div class="flashcard-la">Passez à la coupe suivante ou recommencez</div>
              </div>
              <div class="flashcard-btns">
                <button class="fc-btn ok" id="dock-btn-restart">🔄 Rejouer</button>
                <button class="fc-btn reveal" id="dock-btn-next-slice">Coupe suiv. →</button>
              </div>
            </div>
          `;
          document.getElementById("dock-btn-restart").addEventListener("click", () => {
            initSliceQuizState();
            renderAll();
          });
          document.getElementById("dock-btn-next-slice").addEventListener("click", () => stepSlice(1));
          return;
        }

        const catMeta = CATEGORY_META[targetPt.category] || { label: "Structure", color: "#38bdf8", icon: "🎯" };
        elProgressDot.style.background = catMeta.color;
        elProgressText.textContent = `${catMeta.label} • ${ Math.min(doneCount + 1, points.length) } / ${points.length}`;

        if (state.mode === "qcm") {
          elDockInner.innerHTML = `
            <div class="dock-prompt-row" id="qcm-prompt-row">
              <div class="dock-prompt-text" id="qcm-prompt-text">${catMeta.icon} Quelle est la structure pointée ?</div>
              <div class="dock-actions-group" id="qcm-actions-group">
                <button class="dock-pace-chip" id="btn-cycle-pace" title="Changer le délai après validation">${getPaceShortLabel()}</button>
                <button class="dock-skip-btn" id="btn-skip-q">Passer →</button>
              </div>
            </div>
            <div class="qcm-grid" id="qcm-grid"></div>
          `;
          bindPaceChipButton();
          const grid = document.getElementById("qcm-grid");
          state.qcmOptions.forEach(optLabel => {
            const btn = document.createElement("button");
            btn.className = "qcm-btn";
            btn.textContent = optLabel;
            btn.addEventListener("click", () => {
              if (state.qcmAnswered) return;
              state.qcmAnswered = true;
              const isCorrect = optLabel === targetPt.labelFr;
              state.scoreTotal++;
              if (isCorrect) {
                state.pointStatus[targetPt.id] = "ok";
                btn.textContent = `✓ ${optLabel}`;
                btn.classList.add("correct");
                celebrateCorrectAnswer(targetPt);
                const sTag = state.streak >= 2 ? ` 🔥${state.streak}` : "";
                elScoreBadge.textContent = `✓ ${state.scoreOk}/${state.scoreTotal}${sTag}`;
              } else {
                registerWrongAnswer();
                state.pointStatus[targetPt.id] = "ko";
                btn.textContent = `✗ ${optLabel}`;
                btn.classList.add("wrong");
                [...grid.children].forEach(b => {
                  if (b.textContent === targetPt.labelFr) {
                    b.textContent = `✓ ${targetPt.labelFr}`;
                    b.classList.add("correct");
                  }
                });
                elScoreBadge.textContent = `✓ ${state.scoreOk}/${state.scoreTotal}`;
                renderSvgStage();
              }

              const elPromptText = document.getElementById("qcm-prompt-text");
              const elActionsGroup = document.getElementById("qcm-actions-group");
              if (elPromptText) {
                const statusPrefix = isCorrect
                  ? `<span style="color:var(--success)">✓ Exact :</span>`
                  : `<span style="color:var(--danger)">✗ Réponse :</span>`;
                const laSub = targetPt.labelLa ? `<span class="dock-prompt-sub">${escapeHtml(targetPt.labelLa)}</span>` : "";
                elPromptText.innerHTML = `${statusPrefix} ${escapeHtml(targetPt.labelFr)}${laSub}`;
              }
              if (elActionsGroup) {
                const isManual = state.advancePace === "manuel";
                elActionsGroup.innerHTML = `
                  <button class="dock-pause-btn ${isManual ? "paused" : ""}" id="btn-pause-advance" title="Figer la réponse pour étudier la coupe">${isManual ? "✋ Manuel" : "⏸ Figer"}</button>
                  <button class="dock-next-btn ${isCorrect ? "success" : ""}" id="btn-next-q">Suivant →</button>
                `;
                bindPostValidationButtons();
              }

              scheduleAdvance(isCorrect);
            });
            grid.appendChild(btn);
          });
          const btnSkip = document.getElementById("btn-skip-q");
          if (btnSkip) btnSkip.addEventListener("click", skipCurrentQuestion);
        } else if (state.mode === "flashcard") {
          if (!state.flashcardRevealed) {
            elDockInner.innerHTML = `
              <div class="dock-prompt-row">
                <div class="dock-prompt-text">${catMeta.icon} Devinez la structure pointée (${catMeta.label})</div>
                <div class="dock-actions-group">
                  <button class="dock-pace-chip" id="btn-cycle-pace" title="Changer le délai après validation">${getPaceShortLabel()}</button>
                  <button class="dock-skip-btn" id="btn-skip-q">Passer →</button>
                </div>
              </div>
              <div class="flashcard-box" style="padding:6px;">
                <button class="fc-btn reveal" id="btn-fc-reveal">👁️ Voir la réponse</button>
              </div>
            `;
            bindPaceChipButton();
            document.getElementById("btn-fc-reveal").addEventListener("click", () => {
              state.flashcardRevealed = true;
              renderAll();
            });
            document.getElementById("btn-skip-q").addEventListener("click", skipCurrentQuestion);
          } else if (!state.fcAnswered) {
            elDockInner.innerHTML = `
              <div class="flashcard-box">
                <div class="flashcard-answer">
                  <div class="flashcard-fr">${escapeHtml(targetPt.labelFr)}</div>
                  ${targetPt.labelLa ? `<div class="flashcard-la">${escapeHtml(targetPt.labelLa)}</div>` : ""}
                </div>
                <div class="flashcard-btns">
                  <button class="fc-btn ok" id="btn-fc-ok">✓ J'avais bon</button>
                  <button class="fc-btn ko" id="btn-fc-ko">✗ À revoir</button>
                </div>
              </div>
            `;
            document.getElementById("btn-fc-ok").addEventListener("click", () => {
              state.fcAnswered = true;
              state.scoreTotal++;
              state.pointStatus[targetPt.id] = "ok";
              celebrateCorrectAnswer(targetPt);
              renderBottomDock();
              scheduleAdvance(true);
            });
            document.getElementById("btn-fc-ko").addEventListener("click", () => {
              state.fcAnswered = true;
              registerWrongAnswer();
              state.scoreTotal++;
              state.pointStatus[targetPt.id] = "ko";
              renderSvgStage();
              renderBottomDock();
              scheduleAdvance(false);
            });
          } else {
            const isManual = state.advancePace === "manuel";
            elDockInner.innerHTML = `
              <div class="flashcard-box">
                <div class="flashcard-answer">
                  <div class="flashcard-fr" style="color:${state.lastAnswerCorrect ? "var(--success)" : "var(--danger)"}">${state.lastAnswerCorrect ? "✓" : "✗"} ${escapeHtml(targetPt.labelFr)}</div>
                  ${targetPt.labelLa ? `<div class="flashcard-la">${escapeHtml(targetPt.labelLa)}</div>` : ""}
                </div>
                <div class="dock-actions-group">
                  <button class="dock-pause-btn ${isManual || state.advancePaused ? "paused" : ""}" id="btn-pause-advance">${isManual ? "✋ Manuel" : (state.advancePaused ? "⏸ Figé" : "⏸ Figer")}</button>
                  <button class="dock-next-btn ${state.lastAnswerCorrect ? "success" : ""}" id="btn-next-q">Suivant →</button>
                </div>
              </div>
            `;
            bindPostValidationButtons();
          }
        } else if (state.mode === "pin") {
          if (!state.pinAnswered) {
            elDockInner.innerHTML = `
              <div class="flashcard-box">
                <div class="flashcard-answer">
                  <div class="flashcard-la">🎯 Touchez ce point directement sur la planche :</div>
                  <div class="flashcard-fr" style="color:var(--primary)">${catMeta.icon} ${escapeHtml(targetPt.labelFr)}</div>
                </div>
                <div class="dock-actions-group">
                  <button class="dock-pace-chip" id="btn-cycle-pace" title="Changer le délai après validation">${getPaceShortLabel()}</button>
                  <button class="dock-skip-btn" id="btn-skip-q">Passer →</button>
                </div>
              </div>
            `;
            bindPaceChipButton();
            document.getElementById("btn-skip-q").addEventListener("click", skipCurrentQuestion);
          } else {
            const isManual = state.advancePace === "manuel";
            elDockInner.innerHTML = `
              <div class="flashcard-box">
                <div class="flashcard-answer">
                  <div class="flashcard-fr" style="color:var(--success)">✓ ${escapeHtml(targetPt.labelFr)}</div>
                  ${targetPt.labelLa ? `<div class="flashcard-la">${escapeHtml(targetPt.labelLa)}</div>` : ""}
                </div>
                <div class="dock-actions-group">
                  <button class="dock-pause-btn ${isManual || state.advancePaused ? "paused" : ""}" id="btn-pause-advance">${isManual ? "✋ Manuel" : (state.advancePaused ? "⏸ Figé" : "⏸ Figer")}</button>
                  <button class="dock-next-btn success" id="btn-next-q">Suivant →</button>
                </div>
              </div>
            `;
            bindPostValidationButtons();
          }
        } else if (state.mode === "study") {
          elDockInner.innerHTML = `
            <div class="flashcard-box">
              <div class="flashcard-answer">
                <div class="flashcard-fr">${catMeta.icon} ${escapeHtml(targetPt.labelFr)}</div>
                <div class="flashcard-la">${escapeHtml(targetPt.labelLa || "Touchez n'importe quel point sur la coupe pour l'afficher")}</div>
              </div>
              <button class="dock-skip-btn" id="btn-skip-q">Suivant →</button>
            </div>
          `;
          document.getElementById("btn-skip-q").addEventListener("click", skipCurrentQuestion);
        }
      }

      function skipCurrentQuestion() {
        clearAdvanceTimer();
        if (state.quizQueue.length > 1) {
          const first = state.quizQueue.shift();
          state.quizQueue.push(first);
          state.currentTargetPointId = state.quizQueue[0];
          state.flashcardRevealed = false;
          state.fcAnswered = false;
          state.pinAnswered = false;
          prepareQcmOptions();
          renderAll();
        }
      }

      function renderHeaderAndDrawer() {
        const mod = getActiveModule();
        const slice = getCurrentSlice();
        const slices = getSeriesSlices(state.currentSeriesId);
        const curIdx = slices.findIndex(s => s.id === state.currentSliceId);
        const activeNames = [...state.activeCategories].map(c => CATEGORY_META[c]?.label).filter(Boolean);

        elSliceTitle.textContent = slice.title_2 ? `${mod.icon} ${slice.title_1} — ${slice.title_2}` : `${mod.icon} ${slice.title_1}`;
        elSliceSub.textContent = `${mod.name} (${curIdx + 1}/${slices.length}) • ${activeNames.length <= 3 ? activeNames.join(", ") : `${activeNames.length} catégories`}`;

        // Category pills in Drawer
        const countsByCat = {};
        slice.points.forEach(p => { countsByCat[p.category] = (countsByCat[p.category] || 0) + 1; });

        elCatChips.innerHTML = "";
        Object.keys(CATEGORY_META).forEach(catKey => {
          const meta = CATEGORY_META[catKey];
          const count = countsByCat[catKey] || 0;
          const isActive = state.activeCategories.has(catKey);

          const btn = document.createElement("button");
          btn.className = `cat-pill ${isActive ? "active" : ""} ${count === 0 ? "empty" : ""}`;
          btn.style.setProperty("--cat-color", meta.color);
          btn.innerHTML = `
            <span class="cat-dot" style="background:${meta.color}"></span>
            <span>${meta.label} (${count})</span>
          `;
          btn.addEventListener("click", () => {
            if (state.activeCategories.has(catKey)) {
              if (state.activeCategories.size > 1) state.activeCategories.delete(catKey);
            } else {
              state.activeCategories.add(catKey);
            }
            initSliceQuizState();
            renderAll();
          });
          elCatChips.appendChild(btn);
        });

        // Thumbnails in Drawer
        elThumbStrip.innerHTML = "";
        slices.forEach((sl, idx) => {
          const item = document.createElement("div");
          item.className = `thumb-item ${sl.id === state.currentSliceId ? "active" : ""}`;
          item.innerHTML = `
            <img src="${sl.image}" alt="${escapeHtml(sl.title_1)}" loading="lazy" />
            <span class="thumb-index">${idx + 1}</span>
          `;
          item.addEventListener("click", () => {
            selectSlice(sl.id, false);
            elDrawerBackdrop.classList.remove("open");
          });
          elThumbStrip.appendChild(item);
        });
      }

      function selectSlice(sliceId, autoAdjust = false) {
        state.currentSliceId = sliceId;
        const slice = getCurrentSlice();
        if (autoAdjust) ensureNonEmptyCategoriesForSlice(slice);
        resetZoom();
        initSliceQuizState();
        renderAll();
      }

      function stepSlice(delta) {
        const slices = getSeriesSlices(state.currentSeriesId);
        const idx = slices.findIndex(s => s.id === state.currentSliceId);
        if (idx === -1) return;
        const nextIdx = (idx + delta + slices.length) % slices.length;
        selectSlice(slices[nextIdx].id, false);
      }

      function renderAll() {
        renderHeaderAndDrawer();
        renderSvgStage();
        renderBottomDock();
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Drawer Controls
      document.getElementById("btn-open-drawer").addEventListener("click", () => elDrawerBackdrop.classList.add("open"));
      document.getElementById("open-drawer-title").addEventListener("click", () => elDrawerBackdrop.classList.add("open"));
      document.getElementById("btn-close-drawer").addEventListener("click", () => elDrawerBackdrop.classList.remove("open"));
      elDrawerBackdrop.addEventListener("click", (e) => {
        if (e.target === elDrawerBackdrop) elDrawerBackdrop.classList.remove("open");
      });

      // Module Switching (Membre Supérieur / Membre Inférieur / Rachis & Dos)
      document.querySelectorAll("#module-grid [data-module]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#module-grid [data-module]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const modKey = btn.getAttribute("data-module");
          state.currentModuleKey = modKey;
          const mod = getActiveModule();
          state.currentSeriesId = mod.defaultSeriesId;
          state.currentSliceId = mod.defaultSliceId;
          initSeriesDropdown();
          resetZoom();
          initSliceQuizState();
          renderAll();
        });
      });

      // Quiz Mode Switching
      document.querySelectorAll("#mode-grid [data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#mode-grid [data-mode]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.mode = btn.getAttribute("data-mode");
          initSliceQuizState();
          renderAll();
          elDrawerBackdrop.classList.remove("open");
        });
      });

      // Advance Pace Switching
      document.querySelectorAll("#pace-grid [data-pace]").forEach(btn => {
        if (btn.getAttribute("data-pace") === state.advancePace) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
        btn.addEventListener("click", () => {
          document.querySelectorAll("#pace-grid [data-pace]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.advancePace = btn.getAttribute("data-pace");
          try {
            localStorage.setItem("anat_advance_pace", state.advancePace);
          } catch (_) {}
          syncPaceButtonsUI();
          if (isQuestionValidated()) {
            scheduleAdvance(state.lastAnswerCorrect);
          }
        });
      });

      function setPresetCategories(cats) {
        state.activeCategories = new Set(cats);
        initSliceQuizState();
        renderAll();
        elDrawerBackdrop.classList.remove("open");
      }

      document.getElementById("preset-vasc-nerf").addEventListener("click", () => setPresetCategories(["N", "A", "V"]));
      document.getElementById("preset-nerf-only").addEventListener("click", () => setPresetCategories(["N"]));
      document.getElementById("preset-art-only").addEventListener("click", () => setPresetCategories(["A"]));
      document.getElementById("preset-muscles").addEventListener("click", () => setPresetCategories(["M", "T", "F"]));
      document.getElementById("preset-osteo").addEventListener("click", () => setPresetCategories(["O", "E", "L"]));
      document.getElementById("preset-all").addEventListener("click", () => setPresetCategories(Object.keys(CATEGORY_META)));

      document.getElementById("btn-reset-quiz").addEventListener("click", () => {
        state.scoreOk = 0;
        state.scoreTotal = 0;
        initSliceQuizState();
        renderAll();
        elDrawerBackdrop.classList.remove("open");
      });

      document.getElementById("btn-theme").addEventListener("click", () => {
        const html = document.documentElement;
        const isDark = html.getAttribute("data-theme") === "dark";
        html.setAttribute("data-theme", isDark ? "light" : "dark");
      });

      document.getElementById("btn-prev-slice").addEventListener("click", () => stepSlice(-1));
      document.getElementById("btn-next-slice").addEventListener("click", () => stepSlice(1));

      // ==========================================
      // ZOOM & PAN (PINCH, DOUBLE-TAP, WHEEL, DRAG)
      // ==========================================
      const elStage = document.getElementById("stage-container");
      const elZoomBadge = document.getElementById("zoom-level-badge");
      let zoomScale = 1;
      let panX = 0;
      let panY = 0;

      function applyZoomTransform() {
        if (zoomScale <= 1.01) {
          zoomScale = 1;
          panX = 0;
          panY = 0;
        } else {
          const rect = elStage.getBoundingClientRect();
          const minX = rect.width * (1 - zoomScale);
          const minY = rect.height * (1 - zoomScale);
          panX = Math.min(0, Math.max(minX, panX));
          panY = Math.min(0, Math.max(minY, panY));
        }
        elSvg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
        elZoomBadge.textContent = `${Math.round(zoomScale * 100)}%`;
      }

      function zoomAboutPoint(newScale, clientX, clientY) {
        pauseAdvanceTimer();
        const clamped = Math.min(6, Math.max(1, newScale));
        if (clamped === zoomScale) return;
        const rect = elStage.getBoundingClientRect();
        const cx = clientX - rect.left;
        const cy = clientY - rect.top;
        const ratio = clamped / zoomScale;
        panX = cx - (cx - panX) * ratio;
        panY = cy - (cy - panY) * ratio;
        zoomScale = clamped;
        applyZoomTransform();
      }

      function resetZoom() {
        zoomScale = 1;
        panX = 0;
        panY = 0;
        applyZoomTransform();
      }

      document.getElementById("btn-zoom-in").addEventListener("click", (e) => {
        e.stopPropagation();
        const rect = elStage.getBoundingClientRect();
        zoomAboutPoint(zoomScale * 1.35, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      document.getElementById("btn-zoom-out").addEventListener("click", (e) => {
        e.stopPropagation();
        const rect = elStage.getBoundingClientRect();
        zoomAboutPoint(zoomScale / 1.35, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      document.getElementById("btn-zoom-reset").addEventListener("click", (e) => {
        e.stopPropagation();
        resetZoom();
      });

      elZoomBadge.addEventListener("click", (e) => {
        e.stopPropagation();
        resetZoom();
      });

      elStage.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAboutPoint(zoomScale * factor, e.clientX, e.clientY);
      }, { passive: false });

      let touchMode = null;
      let startTouchX = 0;
      let startTouchY = 0;
      let startPanX = 0;
      let startPanY = 0;
      let initialPinchDist = 0;
      let initialPinchScale = 1;
      let lastTapTime = 0;

      function getTouchDist(t1, t2) {
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      }

      elStage.addEventListener("touchstart", (e) => {
        if (e.target.closest(".zoom-toolbar")) return;
        state.didPan = false;
        if (e.touches.length === 2) {
          touchMode = "pinch";
          initialPinchDist = getTouchDist(e.touches[0], e.touches[1]);
          initialPinchScale = zoomScale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTapTime < 280 && !e.target.closest("[data-pt-id]")) {
            if (zoomScale > 1.2) resetZoom();
            else zoomAboutPoint(2.5, e.touches[0].clientX, e.touches[0].clientY);
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;
          touchMode = "pan";
          startTouchX = e.touches[0].clientX;
          startTouchY = e.touches[0].clientY;
          startPanX = panX;
          startPanY = panY;
        }
      }, { passive: true });

      elStage.addEventListener("touchmove", (e) => {
        if (touchMode === "pinch" && e.touches.length === 2) {
          e.preventDefault();
          state.didPan = true;
          const dist = getTouchDist(e.touches[0], e.touches[1]);
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          if (initialPinchDist > 10) {
            zoomAboutPoint(initialPinchScale * (dist / initialPinchDist), midX, midY);
          }
        } else if (touchMode === "pan" && e.touches.length === 1 && zoomScale > 1.01) {
          const dx = e.touches[0].clientX - startTouchX;
          const dy = e.touches[0].clientY - startTouchY;
          if (Math.hypot(dx, dy) > 6) {
            state.didPan = true;
            pauseAdvanceTimer();
            e.preventDefault();
            panX = startPanX + dx;
            panY = startPanY + dy;
            applyZoomTransform();
          }
        }
      }, { passive: false });

      elStage.addEventListener("touchend", (e) => {
        if (e.touches.length === 0) {
          touchMode = null;
          setTimeout(() => { state.didPan = false; }, 60);
        } else if (e.touches.length === 1) {
          touchMode = "pan";
          startTouchX = e.touches[0].clientX;
          startTouchY = e.touches[0].clientY;
          startPanX = panX;
          startPanY = panY;
        }
      });

      let isMouseDragging = false;
      elStage.addEventListener("mousedown", (e) => {
        if (e.button !== 0 || e.target.closest(".zoom-toolbar")) return;
        isMouseDragging = true;
        state.didPan = false;
        startTouchX = e.clientX;
        startTouchY = e.clientY;
        startPanX = panX;
        startPanY = panY;
        if (zoomScale > 1.01) elStage.classList.add("is-panning");
      });

      window.addEventListener("mousemove", (e) => {
        if (!isMouseDragging || zoomScale <= 1.01) return;
        const dx = e.clientX - startTouchX;
        const dy = e.clientY - startTouchY;
        if (Math.hypot(dx, dy) > 5) {
          state.didPan = true;
          pauseAdvanceTimer();
          panX = startPanX + dx;
          panY = startPanY + dy;
          applyZoomTransform();
        }
      });

      window.addEventListener("mouseup", () => {
        if (isMouseDragging) {
          isMouseDragging = false;
          elStage.classList.remove("is-panning");
          setTimeout(() => { state.didPan = false; }, 50);
        }
      });

      initSeriesDropdown();
      initSliceQuizState();
      renderAll();
    })();
  </script>
</body>
</html>
