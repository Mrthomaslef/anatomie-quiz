<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>IMAIOS Anatomy Quiz — Membre Supérieur</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-panel: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg-app: #0b1120;
      --bg-panel: #111827;
      --bg-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================
       1. ULTRA-COMPACT TOPBAR
       ========================================== */
    .topbar {
      padding-top: var(--safe-top);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 40;
      flex-shrink: 0;
    }

    .topbar-inner {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 6px;
    }

    .nav-slice-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-btn:active {
      background: var(--primary);
      color: #fff;
    }

    .slice-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .slice-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slice-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .score-badge {
      background: var(--success-soft);
      color: #059669;
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }
    [data-theme="dark"] .score-badge {
      color: #34d399;
    }

    .settings-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .settings-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ==========================================
       2. GIANT ANATOMICAL STAGE (MAXIMIZED SPACE)
       ========================================== */
    .stage-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      touch-action: none;
      cursor: grab;
    }

    .stage-wrapper.is-panning {
      cursor: grabbing;
    }

    #anatomy-svg {
      width: 100%;
      height: 100%;
      display: block;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* SVG POINTS & TARGET MARKER */
    .anat-point-group {
      cursor: pointer;
    }

    .anat-point-hit {
      fill: transparent;
      r: 22px;
    }

    .anat-point-outer {
      r: 6px;
      stroke: #0f172a;
      stroke-width: 1.8px;
      transition: r 0.15s, stroke-width 0.15s, opacity 0.15s;
    }

    .anat-point-inner {
      r: 2.2px;
      fill: #0f172a;
      pointer-events: none;
    }

    .anat-point-group.faded {
      opacity: 0.35;
    }

    .anat-point-group.done-ok .anat-point-outer {
      fill: #10b981 !important;
      stroke: #064e3b;
      r: 5.5px;
    }

    .anat-point-group.done-ko .anat-point-outer {
      fill: #ef4444 !important;
      stroke: #7f1d1d;
      r: 5.5px;
    }

    @keyframes pulseRing {
      0% { r: 10px; stroke-opacity: 0.95; stroke-width: 4px; }
      100% { r: 28px; stroke-opacity: 0; stroke-width: 1px; }
    }

    .target-pulse-ring {
      fill: none;
      stroke: #2563eb;
      pointer-events: none;
      animation: pulseRing 1.4s infinite ease-out;
    }

    .target-leader-line {
      stroke: #2563eb;
      stroke-width: 2.8;
      stroke-dasharray: 5 3;
      pointer-events: none;
    }

    .target-callout-pill {
      fill: #1e293b;
      stroke: #38bdf8;
      stroke-width: 2;
      rx: 8;
      ry: 8;
    }

    .target-callout-text {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 800;
      fill: #ffffff;
      dominant-baseline: central;
      text-anchor: middle;
      pointer-events: none;
    }

    /* FLOATING ZOOM BAR */
    .zoom-toolbar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 22;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-level-badge {
      padding: 0 6px;
      font-size: 11px;
      font-weight: 700;
      color: #f8fafc;
      min-width: 40px;
      text-align: center;
      cursor: pointer;
    }

    /* PROGRESS PILL OVERLAY TOP-LEFT */
    .progress-pill {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 22;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .progress-cat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid #fff;
    }

    /* ==========================================
       3. COMPACT ONE-BY-ONE QUESTION DOCK (BOTTOM)
       ========================================== */
    .question-dock {
      padding-bottom: var(--safe-bottom);
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      z-index: 30;
      flex-shrink: 0;
      box-shadow: 0 -4px 18px rgba(15, 23, 42, 0.08);
    }

    .dock-inner {
      padding: 10px 12px;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dock-prompt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .dock-prompt-text {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      flex: 1;
    }

    .dock-skip-btn {
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* QCM 2x2 COMPACT GRID */
    .qcm-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    @media (max-width: 520px) {
      .qcm-grid {
        grid-template-columns: repeat(2, 1fr); /* 2x2 compact buttons on mobile so dock stays super low-profile! */
      }
    }

    .qcm-btn {
      padding: 9px 10px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
      min-height: 42px;
      transition: all 0.12s;
    }

    .qcm-btn:active {
      transform: scale(0.98);
    }

    .qcm-btn.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: #065f46;
      font-weight: 700;
    }
    [data-theme="dark"] .qcm-btn.correct { color: #6ee7b7; }

    .qcm-btn.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #991b1b;
    }
    [data-theme="dark"] .qcm-btn.wrong { color: #fca5a5; }

    /* FLASHCARD MODE (1 QUESTION AT A TIME: REVEAL -> JUSTE / FAUX) */
    .flashcard-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      min-height: 48px;
    }

    .flashcard-answer {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .flashcard-fr {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .flashcard-la {
      font-size: 11px;
      font-style: italic;
      color: var(--text-muted);
    }

    .flashcard-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .fc-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: none;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fc-btn.reveal {
      background: var(--primary);
      color: #fff;
      width: 100%;
      justify-content: center;
    }

    .fc-btn.ok {
      background: var(--success);
      color: #fff;
    }

    .fc-btn.ko {
      background: var(--danger);
      color: #fff;
    }

    /* ==========================================
       4. SETTINGS & FILTERS MODAL DRAWER
       ========================================== */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-sheet {
      background: var(--bg-panel);
      width: min(560px, 100%);
      max-height: 86dvh;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
    }

    .drawer-close {
      border: none;
      background: var(--bg-subtle);
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .drawer-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .drawer-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .drawer-select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .mode-card {
      padding: 9px 10px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-card.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .presets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-chip {
      border: 1px dashed var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .cats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cat-pill {
      border: 1.5px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0.55;
    }

    .cat-pill.active {
      opacity: 1;
      background: var(--bg-panel);
      color: var(--text-main);
      border-color: var(--cat-color, var(--primary));
    }

    .cat-pill.empty {
      display: none;
    }

    .cat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.25);
    }

    .thumb-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 2px;
      -webkit-overflow-scrolling: touch;
    }

    .thumb-item {
      width: 48px;
      height: 50px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .thumb-item.active {
      border-color: var(--primary);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .thumb-index {
      position: absolute;
      bottom: 1px;
      right: 2px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 8.5px;
      font-weight: 700;
      padding: 0 3px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- 1. ULTRA-COMPACT TOPBAR -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="nav-slice-group">
        <button class="nav-btn" id="btn-prev-slice" title="Coupe précédente">←</button>
        <div class="slice-info" id="open-drawer-title" title="Changer de coupe ou de filtres">
          <div class="slice-title" id="slice-title-display">Région deltoïdienne</div>
          <div class="slice-sub" id="slice-sub-display">Coupe 1/13 • Nerfs, Artères, Veines</div>
        </div>
        <button class="nav-btn" id="btn-next-slice" title="Coupe suivante">→</button>
      </div>

      <div class="top-actions">
        <span class="score-badge" id="score-badge">0 / 0</span>
        <button class="settings-btn" id="btn-open-drawer">⚙️ Réglages</button>
      </div>
    </div>
  </header>

  <!-- 2. GIANT ANATOMICAL STAGE -->
  <main class="stage-wrapper" id="stage-container">
    <!-- Top-left current question progress pill -->
    <div class="progress-pill" id="progress-pill">
      <span class="progress-cat-dot" id="progress-cat-dot" style="background:#FBE94F"></span>
      <span id="progress-text">Question 1 / 12</span>
    </div>

    <!-- Floating Zoom Controls -->
    <div class="zoom-toolbar" aria-label="Contrôles de zoom">
      <button class="zoom-btn" id="btn-zoom-out" title="Dézoomer">−</button>
      <span class="zoom-level-badge" id="zoom-level-badge" title="100%">100%</span>
      <button class="zoom-btn" id="btn-zoom-in" title="Zoomer">+</button>
      <button class="zoom-btn" id="btn-zoom-reset" title="Recadrer" style="font-size:12px;">⟲</button>
    </div>

    <svg id="anatomy-svg" viewBox="0 0 640 670" preserveAspectRatio="xMidYMid meet"></svg>
  </main>

  <!-- 3. ONE-QUESTION-AT-A-TIME BOTTOM DOCK -->
  <footer class="question-dock" id="question-dock">
    <div class="dock-inner" id="dock-inner"></div>
  </footer>

  <!-- 4. SETTINGS & FILTERS DRAWER MODAL -->
  <div class="drawer-backdrop" id="drawer-backdrop">
    <div class="drawer-sheet" id="drawer-sheet">
      <div class="drawer-header">
        <span class="drawer-title">⚙️ Configurer le Quiz</span>
        <button class="drawer-close" id="btn-close-drawer">✕</button>
      </div>

      <div class="drawer-section">
        <span class="drawer-label">Mode de révision (1 question par 1)</span>
        <div class="mode-grid">
          <button class="mode-card active" data-mode="qcm">🧠 Quiz QCM (4 choix)</button>
          <button class="mode-card" data-mode="flashcard">🙈 Flashcard (Deviner)</button>
          <button class="mode-card" data-mode="pin">🎯 Quiz Épingle (Localiser)</button>
          <button class="mode-card" data-mode="study">📖 Mode Exploration</button>
        </div>
      </div>

      <div class="drawer-section">
        <span class="drawer-label">Que voulez-vous réviser ?</span>
        <div class="presets-row">
          <button class="preset-chip" id="preset-vasc-nerf">⚡ Nerfs + Vaisseaux</button>
          <button class="preset-chip" id="preset-nerf-only">🟡 Nerfs seuls</button>
          <button class="preset-chip" id="preset-art-only">🔴 Artères seules</button>
          <button class="preset-chip" id="preset-muscles">💪 Muscles & Tendons</button>
          <button class="preset-chip" id="preset-osteo">🦴 Os & Articulations</button>
          <button class="preset-chip" id="preset-all">✅ Tout</button>
        </div>
        <div class="cats-grid" id="category-chips-container"></div>
      </div>

      <div class="drawer-section">
        <span class="drawer-label">Série & Planche IMAIOS</span>
        <select id="series-select" class="drawer-select"></select>
        <div class="thumb-strip" id="thumb-strip"></div>
      </div>

      <div class="drawer-section" style="flex-direction:row;justify-content:space-between;align-items:center;">
        <button class="settings-btn" id="btn-reset-quiz" style="flex:1;justify-content:center;height:38px;">🔄 Recommencer cette coupe</button>
        <button class="settings-btn" id="btn-theme" style="height:38px;">🌙 Thème</button>
      </div>
    </div>
  </div>

  <script src="data/imaios_upper_limb.js"></script>
  <script>
    (function () {
      const DATA = window.IMAIOS_UPPER_LIMB_DATA;
      if (!DATA) return;

      const CATEGORY_META = {
        N: { label: "Nerfs", color: "#FBE94F", icon: "⚡" },
        A: { label: "Artères", color: "#FF0000", icon: "🩸" },
        V: { label: "Veines", color: "#52BBFE", icon: "💧" },
        M: { label: "Muscles", color: "#FE6137", icon: "💪" },
        T: { label: "Tendons", color: "#CEE9F6", icon: "🪢" },
        F: { label: "Fascias & Bourses", color: "#D8F0F0", icon: "🛡️" },
        O: { label: "Os", color: "#E6D9C4", icon: "🦴" },
        E: { label: "Articulations", color: "#66FFFF", icon: "⚙️" },
        L: { label: "Ligaments", color: "#CCFF32", icon: "🔗" },
        G: { label: "Lymphatiques", color: "#86EFAC", icon: "🟢" },
        P: { label: "Régions", color: "#CBD5E1", icon: "🗺️" }
      };

      const state = {
        currentSeriesId: 243,
        currentSliceId: 8019,
        activeCategories: new Set(["N", "A", "V"]),
        mode: "qcm", // Default to 1-by-1 QCM so user immediately gets 1 clear question at a time!
        pointStatus: {}, // 'pending' | 'ok' | 'ko'
        quizQueue: [],
        currentTargetPointId: null,
        flashcardRevealed: false,
        qcmOptions: [],
        qcmAnswered: false,
        scoreOk: 0,
        scoreTotal: 0,
        didPan: false
      };

      // DOM Elements
      const elSliceTitle = document.getElementById("slice-title-display");
      const elSliceSub = document.getElementById("slice-sub-display");
      const elScoreBadge = document.getElementById("score-badge");
      const elProgressDot = document.getElementById("progress-cat-dot");
      const elProgressText = document.getElementById("progress-text");
      const elSvg = document.getElementById("anatomy-svg");
      const elDockInner = document.getElementById("dock-inner");
      const elDrawerBackdrop = document.getElementById("drawer-backdrop");
      const elSeriesSelect = document.getElementById("series-select");
      const elCatChips = document.getElementById("category-chips-container");
      const elThumbStrip = document.getElementById("thumb-strip");

      function getSeriesSlices(seriesId) {
        if (seriesId === 0) return DATA.slices;
        return DATA.slices.filter(s => s.series_id === seriesId);
      }

      function getCurrentSlice() {
        return DATA.slices.find(s => s.id === state.currentSliceId) || DATA.slices[0];
      }

      function getFilteredPoints(slice) {
        return slice.points.filter(p => state.activeCategories.has(p.category));
      }

      function ensureNonEmptyCategoriesForSlice(slice) {
        const hasAny = slice.points.some(p => state.activeCategories.has(p.category));
        if (!hasAny && slice.points.length > 0) {
          slice.points.forEach(p => state.activeCategories.add(p.category));
        }
      }

      function initSeriesDropdown() {
        elSeriesSelect.innerHTML = "";
        const optAll = document.createElement("option");
        optAll.value = "0";
        optAll.textContent = `Toutes les séries (${DATA.slices.length} planches)`;
        elSeriesSelect.appendChild(optAll);

        DATA.series.forEach(ser => {
          const opt = document.createElement("option");
          opt.value = String(ser.id);
          opt.textContent = `${ser.name} (${ser.number_of_images})`;
          if (ser.id === state.currentSeriesId) opt.selected = true;
          elSeriesSelect.appendChild(opt);
        });

        elSeriesSelect.addEventListener("change", () => {
          state.currentSeriesId = Number(elSeriesSelect.value);
          const slices = getSeriesSlices(state.currentSeriesId);
          if (slices.length > 0) selectSlice(slices[0].id, true);
        });
      }

      function initSliceQuizState() {
        const slice = getCurrentSlice();
        const pts = getFilteredPoints(slice);
        state.pointStatus = {};
        pts.forEach(p => { state.pointStatus[p.id] = "pending"; });

        // Order questions top-to-bottom or shuffled
        state.quizQueue = pts.map(p => p.id).sort(() => Math.random() - 0.5);
        state.currentTargetPointId = state.quizQueue[0] || null;
        state.flashcardRevealed = false;
        prepareQcmOptions();
      }

      function prepareQcmOptions() {
        const slice = getCurrentSlice();
        const targetPt = slice.points.find(p => p.id === state.currentTargetPointId);
        state.qcmAnswered = false;
        if (!targetPt) {
          state.qcmOptions = [];
          return;
        }
        // Prefer distractors from the same slice & category first, then global category
        const sameSliceCat = [];
        const globalCat = [];
        const seen = new Set([targetPt.labelFr]);

        slice.points.forEach(p => {
          if (p.category === targetPt.category && !seen.has(p.labelFr)) {
            seen.add(p.labelFr);
            sameSliceCat.push(p.labelFr);
          }
        });

        DATA.slices.forEach(s => {
          s.points.forEach(p => {
            if (p.category === targetPt.category && !seen.has(p.labelFr)) {
              seen.add(p.labelFr);
              globalCat.push(p.labelFr);
            }
          });
        });

        const pool = [...sameSliceCat.sort(() => Math.random() - 0.5), ...globalCat.sort(() => Math.random() - 0.5)];
        const distractors = pool.slice(0, 3);
        state.qcmOptions = [targetPt.labelFr, ...distractors].sort(() => Math.random() - 0.5);
      }

      function advanceQuestion() {
        state.quizQueue = state.quizQueue.filter(id => state.pointStatus[id] === "pending");
        state.currentTargetPointId = state.quizQueue[0] || null;
        state.flashcardRevealed = false;
        prepareQcmOptions();
        renderAll();
      }

      // ==========================================
      // RENDER GIANT CLEAN SVG PLATE (ONLY 1 QUESTION HIGHLIGHTED AT A TIME!)
      // ==========================================
      function renderSvgStage() {
        const slice = getCurrentSlice();
        const points = getFilteredPoints(slice);
        const targetPt = points.find(p => p.id === state.currentTargetPointId);

        let svgHtml = `
          <defs>
            <filter id="pt-shadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.45"/>
            </filter>
          </defs>
          <image href="${slice.image}" x="0" y="0" width="640" height="670" preserveAspectRatio="none" />
        `;

        // In QCM, Flashcard, or Study mode, draw ONLY the leader line and callout for the single active point!
        if (targetPt && state.mode !== "pin") {
          const tx = targetPt.x;
          const ty = targetPt.y;
          // Place a clean callout badge offset from the point so it never covers the anatomy
          const calloutY = ty > 110 ? Math.max(36, ty - 75) : Math.min(634, ty + 75);
          const calloutX = tx < 320 ? Math.max(95, tx - 50) : Math.min(545, tx + 50);

          const showAnswerOnPlate = state.mode === "study" || (state.mode === "flashcard" && state.flashcardRevealed);
          const boxText = showAnswerOnPlate ? targetPt.labelFr : "❓ À identifier";
          const shortText = boxText.length > 32 ? boxText.slice(0, 31) + "…" : boxText;
          const boxW = Math.max(125, shortText.length * 7.8 + 24);

          svgHtml += `
            <line class="target-leader-line" x1="${tx}" y1="${ty}" x2="${calloutX}" y2="${calloutY}" />
            <circle class="target-pulse-ring" cx="${tx}" cy="${ty}" r="14" />
            <g transform="translate(${calloutX}, ${calloutY})">
              <rect class="target-callout-pill" x="${-boxW / 2}" y="-15" width="${boxW}" height="30" />
              <text class="target-callout-text" x="0" y="0">${escapeHtml(shortText)}</text>
            </g>
          `;
        }

        // Draw anatomical points
        points.forEach(pt => {
          const isTarget = state.currentTargetPointId === pt.id;
          const status = state.pointStatus[pt.id] || "pending";
          const fillHex = `#${pt.color || "FFFFFF"}`;

          let groupClass = "anat-point-group";
          if (status === "ok") groupClass += " done-ok";
          else if (status === "ko") groupClass += " done-ko";
          else if (state.mode !== "pin" && !isTarget) groupClass += " faded";

          const rOuter = (isTarget && state.mode !== "pin") ? 8.5 : 6;
          const strokeColor = (isTarget && state.mode !== "pin") ? "#2563eb" : "#0f172a";
          const strokeW = (isTarget && state.mode !== "pin") ? 3 : 1.8;

          svgHtml += `
            <g class="${groupClass}" data-pt-id="${pt.id}" filter="url(#pt-shadow)">
              <circle class="anat-point-hit" cx="${pt.x}" cy="${pt.y}" />
              <circle class="anat-point-outer" cx="${pt.x}" cy="${pt.y}" fill="${fillHex}" style="r:${rOuter}px;stroke:${strokeColor};stroke-width:${strokeW}px;" />
              <circle class="anat-point-inner" cx="${pt.x}" cy="${pt.y}" />
            </g>
          `;
        });

        elSvg.innerHTML = svgHtml;

        // Clicking any point on the plate:
        // - In 'pin' mode: answers the location quiz!
        // - In 'qcm' / 'flashcard' / 'study' mode: switches the active question to that point!
        elSvg.querySelectorAll("[data-pt-id]").forEach(el => {
          const ptId = Number(el.getAttribute("data-pt-id"));
          el.addEventListener("click", (e) => {
            if (state.didPan) return;
            e.stopPropagation();
            onPointTapped(ptId);
          });
        });
      }

      function onPointTapped(ptId) {
        if (state.mode === "pin") {
          if (!state.currentTargetPointId) return;
          state.scoreTotal++;
          if (ptId === state.currentTargetPointId) {
            state.scoreOk++;
            state.pointStatus[ptId] = "ok";
            advanceQuestion();
          } else {
            state.pointStatus[ptId] = "ko";
            renderAll();
          }
        } else {
          // Allow user to tap any point on the plate to immediately question/inspect that point!
          state.currentTargetPointId = ptId;
          state.flashcardRevealed = state.mode === "study";
          prepareQcmOptions();
          renderAll();
        }
      }

      // ==========================================
      // RENDER BOTTOM DOCK (1 QUESTION AT A TIME)
      // ==========================================
      function renderBottomDock() {
        const slice = getCurrentSlice();
        const points = getFilteredPoints(slice);
        const targetPt = points.find(p => p.id === state.currentTargetPointId);
        const doneCount = points.filter(p => state.pointStatus[p.id] !== "pending").length;

        elScoreBadge.textContent = `✓ ${state.scoreOk}/${state.scoreTotal}`;

        if (!targetPt) {
          elProgressText.textContent = `Terminé (${points.length}/${points.length})`;
          elDockInner.innerHTML = `
            <div class="flashcard-box">
              <div class="flashcard-answer">
                <div class="flashcard-fr">🎉 Coupe terminée ! (${state.scoreOk}/${state.scoreTotal} bonnes réponses)</div>
                <div class="flashcard-la">Passez à la coupe suivante ou recommencez</div>
              </div>
              <div class="flashcard-btns">
                <button class="fc-btn ok" id="dock-btn-restart">🔄 Rejouer</button>
                <button class="fc-btn reveal" id="dock-btn-next-slice">Coupe suiv. →</button>
              </div>
            </div>
          `;
          document.getElementById("dock-btn-restart").addEventListener("click", () => {
            initSliceQuizState();
            renderAll();
          });
          document.getElementById("dock-btn-next-slice").addEventListener("click", () => stepSlice(1));
          return;
        }

        const catMeta = CATEGORY_META[targetPt.category] || { label: "Structure", color: "#38bdf8", icon: "🎯" };
        elProgressDot.style.background = catMeta.color;
        elProgressText.textContent = `${catMeta.label} • ${ Math.min(doneCount + 1, points.length) } / ${points.length}`;

        if (state.mode === "qcm") {
          elDockInner.innerHTML = `
            <div class="dock-prompt-row">
              <div class="dock-prompt-text">${catMeta.icon} Quelle est la structure pointée sur la planche ?</div>
              <button class="dock-skip-btn" id="btn-skip-q">Passer →</button>
            </div>
            <div class="qcm-grid" id="qcm-grid"></div>
          `;
          const grid = document.getElementById("qcm-grid");
          state.qcmOptions.forEach(optLabel => {
            const btn = document.createElement("button");
            btn.className = "qcm-btn";
            btn.textContent = optLabel;
            btn.addEventListener("click", () => {
              if (state.qcmAnswered) return;
              state.qcmAnswered = true;
              const isCorrect = optLabel === targetPt.labelFr;
              state.scoreTotal++;
              if (isCorrect) {
                state.scoreOk++;
                state.pointStatus[targetPt.id] = "ok";
                btn.classList.add("correct");
              } else {
                state.pointStatus[targetPt.id] = "ko";
                btn.classList.add("wrong");
                [...grid.children].forEach(b => {
                  if (b.textContent === targetPt.labelFr) b.classList.add("correct");
                });
              }
              setTimeout(() => advanceQuestion(), 650);
            });
            grid.appendChild(btn);
          });
          document.getElementById("btn-skip-q").addEventListener("click", skipCurrentQuestion);
        } else if (state.mode === "flashcard") {
          if (!state.flashcardRevealed) {
            elDockInner.innerHTML = `
              <div class="dock-prompt-row">
                <div class="dock-prompt-text">${catMeta.icon} Devinez la structure pointée (${catMeta.label})</div>
                <button class="dock-skip-btn" id="btn-skip-q">Passer →</button>
              </div>
              <div class="flashcard-box" style="padding:6px;">
                <button class="fc-btn reveal" id="btn-fc-reveal">👁️ Voir la réponse</button>
              </div>
            `;
            document.getElementById("btn-fc-reveal").addEventListener("click", () => {
              state.flashcardRevealed = true;
              renderAll();
            });
            document.getElementById("btn-skip-q").addEventListener("click", skipCurrentQuestion);
          } else {
            elDockInner.innerHTML = `
              <div class="flashcard-box">
                <div class="flashcard-answer">
                  <div class="flashcard-fr">${escapeHtml(targetPt.labelFr)}</div>
                  ${targetPt.labelLa ? `<div class="flashcard-la">${escapeHtml(targetPt.labelLa)}</div>` : ""}
                </div>
                <div class="flashcard-btns">
                  <button class="fc-btn ok" id="btn-fc-ok">✓ J'avais bon</button>
                  <button class="fc-btn ko" id="btn-fc-ko">✗ À revoir</button>
                </div>
              </div>
            `;
            document.getElementById("btn-fc-ok").addEventListener("click", () => {
              state.scoreOk++;
              state.scoreTotal++;
              state.pointStatus[targetPt.id] = "ok";
              advanceQuestion();
            });
            document.getElementById("btn-fc-ko").addEventListener("click", () => {
              state.scoreTotal++;
              state.pointStatus[targetPt.id] = "ko";
              advanceQuestion();
            });
          }
        } else if (state.mode === "pin") {
          elDockInner.innerHTML = `
            <div class="flashcard-box">
              <div class="flashcard-answer">
                <div class="flashcard-la">🎯 Touchez ce point directement sur la planche :</div>
                <div class="flashcard-fr" style="color:var(--primary)">${catMeta.icon} ${escapeHtml(targetPt.labelFr)}</div>
              </div>
              <button class="dock-skip-btn" id="btn-skip-q">Passer →</button>
            </div>
          `;
          document.getElementById("btn-skip-q").addEventListener("click", skipCurrentQuestion);
        } else if (state.mode === "study") {
          elDockInner.innerHTML = `
            <div class="flashcard-box">
              <div class="flashcard-answer">
                <div class="flashcard-fr">${catMeta.icon} ${escapeHtml(targetPt.labelFr)}</div>
                <div class="flashcard-la">${escapeHtml(targetPt.labelLa || "Touchez n'importe quel point sur la coupe pour l'afficher")}</div>
              </div>
              <button class="dock-skip-btn" id="btn-skip-q">Suivant →</button>
            </div>
          `;
          document.getElementById("btn-skip-q").addEventListener("click", skipCurrentQuestion);
        }
      }

      function skipCurrentQuestion() {
        if (state.quizQueue.length > 1) {
          const first = state.quizQueue.shift();
          state.quizQueue.push(first);
          state.currentTargetPointId = state.quizQueue[0];
          state.flashcardRevealed = false;
          prepareQcmOptions();
          renderAll();
        }
      }

      function renderHeaderAndDrawer() {
        const slice = getCurrentSlice();
        const slices = getSeriesSlices(state.currentSeriesId);
        const curIdx = slices.findIndex(s => s.id === state.currentSliceId);
        const activeNames = [...state.activeCategories].map(c => CATEGORY_META[c]?.label).filter(Boolean);

        elSliceTitle.textContent = slice.title_2 ? `${slice.title_1} — ${slice.title_2}` : slice.title_1;
        elSliceSub.textContent = `Coupe ${curIdx + 1}/${slices.length} • ${activeNames.length <= 3 ? activeNames.join(", ") : `${activeNames.length} catégories`}`;

        // Category pills in Drawer
        const countsByCat = {};
        slice.points.forEach(p => { countsByCat[p.category] = (countsByCat[p.category] || 0) + 1; });

        elCatChips.innerHTML = "";
        Object.keys(CATEGORY_META).forEach(catKey => {
          const meta = CATEGORY_META[catKey];
          const count = countsByCat[catKey] || 0;
          const isActive = state.activeCategories.has(catKey);

          const btn = document.createElement("button");
          btn.className = `cat-pill ${isActive ? "active" : ""} ${count === 0 ? "empty" : ""}`;
          btn.style.setProperty("--cat-color", meta.color);
          btn.innerHTML = `
            <span class="cat-dot" style="background:${meta.color}"></span>
            <span>${meta.label} (${count})</span>
          `;
          btn.addEventListener("click", () => {
            if (state.activeCategories.has(catKey)) {
              if (state.activeCategories.size > 1) state.activeCategories.delete(catKey);
            } else {
              state.activeCategories.add(catKey);
            }
            initSliceQuizState();
            renderAll();
          });
          elCatChips.appendChild(btn);
        });

        // Thumbnails in Drawer
        elThumbStrip.innerHTML = "";
        slices.forEach((sl, idx) => {
          const item = document.createElement("div");
          item.className = `thumb-item ${sl.id === state.currentSliceId ? "active" : ""}`;
          item.innerHTML = `
            <img src="${sl.image}" alt="${escapeHtml(sl.title_1)}" loading="lazy" />
            <span class="thumb-index">${idx + 1}</span>
          `;
          item.addEventListener("click", () => {
            selectSlice(sl.id, false);
            elDrawerBackdrop.classList.remove("open");
          });
          elThumbStrip.appendChild(item);
        });
      }

      function selectSlice(sliceId, autoAdjust = false) {
        state.currentSliceId = sliceId;
        const slice = getCurrentSlice();
        if (autoAdjust) ensureNonEmptyCategoriesForSlice(slice);
        resetZoom();
        initSliceQuizState();
        renderAll();
      }

      function stepSlice(delta) {
        const slices = getSeriesSlices(state.currentSeriesId);
        const idx = slices.findIndex(s => s.id === state.currentSliceId);
        if (idx === -1) return;
        const nextIdx = (idx + delta + slices.length) % slices.length;
        selectSlice(slices[nextIdx].id, false);
      }

      function renderAll() {
        renderHeaderAndDrawer();
        renderSvgStage();
        renderBottomDock();
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Drawer Controls
      document.getElementById("btn-open-drawer").addEventListener("click", () => elDrawerBackdrop.classList.add("open"));
      document.getElementById("open-drawer-title").addEventListener("click", () => elDrawerBackdrop.classList.add("open"));
      document.getElementById("btn-close-drawer").addEventListener("click", () => elDrawerBackdrop.classList.remove("open"));
      elDrawerBackdrop.addEventListener("click", (e) => {
        if (e.target === elDrawerBackdrop) elDrawerBackdrop.classList.remove("open");
      });

      document.querySelectorAll(".mode-card").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-card").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.mode = btn.getAttribute("data-mode");
          initSliceQuizState();
          renderAll();
          elDrawerBackdrop.classList.remove("open");
        });
      });

      function setPresetCategories(cats) {
        state.activeCategories = new Set(cats);
        initSliceQuizState();
        renderAll();
        elDrawerBackdrop.classList.remove("open");
      }

      document.getElementById("preset-vasc-nerf").addEventListener("click", () => setPresetCategories(["N", "A", "V"]));
      document.getElementById("preset-nerf-only").addEventListener("click", () => setPresetCategories(["N"]));
      document.getElementById("preset-art-only").addEventListener("click", () => setPresetCategories(["A"]));
      document.getElementById("preset-muscles").addEventListener("click", () => setPresetCategories(["M", "T", "F"]));
      document.getElementById("preset-osteo").addEventListener("click", () => setPresetCategories(["O", "E", "L"]));
      document.getElementById("preset-all").addEventListener("click", () => setPresetCategories(Object.keys(CATEGORY_META)));

      document.getElementById("btn-reset-quiz").addEventListener("click", () => {
        state.scoreOk = 0;
        state.scoreTotal = 0;
        initSliceQuizState();
        renderAll();
        elDrawerBackdrop.classList.remove("open");
      });

      document.getElementById("btn-theme").addEventListener("click", () => {
        const html = document.documentElement;
        const isDark = html.getAttribute("data-theme") === "dark";
        html.setAttribute("data-theme", isDark ? "light" : "dark");
      });

      document.getElementById("btn-prev-slice").addEventListener("click", () => stepSlice(-1));
      document.getElementById("btn-next-slice").addEventListener("click", () => stepSlice(1));

      // ==========================================
      // ZOOM & PAN (PINCH, DOUBLE-TAP, WHEEL, DRAG)
      // ==========================================
      const elStage = document.getElementById("stage-container");
      const elZoomBadge = document.getElementById("zoom-level-badge");
      let zoomScale = 1;
      let panX = 0;
      let panY = 0;

      function applyZoomTransform() {
        if (zoomScale <= 1.01) {
          zoomScale = 1;
          panX = 0;
          panY = 0;
        } else {
          const rect = elStage.getBoundingClientRect();
          const minX = rect.width * (1 - zoomScale);
          const minY = rect.height * (1 - zoomScale);
          panX = Math.min(0, Math.max(minX, panX));
          panY = Math.min(0, Math.max(minY, panY));
        }
        elSvg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
        elZoomBadge.textContent = `${Math.round(zoomScale * 100)}%`;
      }

      function zoomAboutPoint(newScale, clientX, clientY) {
        const clamped = Math.min(6, Math.max(1, newScale));
        if (clamped === zoomScale) return;
        const rect = elStage.getBoundingClientRect();
        const cx = clientX - rect.left;
        const cy = clientY - rect.top;
        const ratio = clamped / zoomScale;
        panX = cx - (cx - panX) * ratio;
        panY = cy - (cy - panY) * ratio;
        zoomScale = clamped;
        applyZoomTransform();
      }

      function resetZoom() {
        zoomScale = 1;
        panX = 0;
        panY = 0;
        applyZoomTransform();
      }

      document.getElementById("btn-zoom-in").addEventListener("click", (e) => {
        e.stopPropagation();
        const rect = elStage.getBoundingClientRect();
        zoomAboutPoint(zoomScale * 1.35, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      document.getElementById("btn-zoom-out").addEventListener("click", (e) => {
        e.stopPropagation();
        const rect = elStage.getBoundingClientRect();
        zoomAboutPoint(zoomScale / 1.35, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      document.getElementById("btn-zoom-reset").addEventListener("click", (e) => {
        e.stopPropagation();
        resetZoom();
      });

      elZoomBadge.addEventListener("click", (e) => {
        e.stopPropagation();
        resetZoom();
      });

      elStage.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAboutPoint(zoomScale * factor, e.clientX, e.clientY);
      }, { passive: false });

      let touchMode = null;
      let startTouchX = 0;
      let startTouchY = 0;
      let startPanX = 0;
      let startPanY = 0;
      let initialPinchDist = 0;
      let initialPinchScale = 1;
      let lastTapTime = 0;

      function getTouchDist(t1, t2) {
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      }

      elStage.addEventListener("touchstart", (e) => {
        if (e.target.closest(".zoom-toolbar")) return;
        state.didPan = false;
        if (e.touches.length === 2) {
          touchMode = "pinch";
          initialPinchDist = getTouchDist(e.touches[0], e.touches[1]);
          initialPinchScale = zoomScale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTapTime < 280 && !e.target.closest("[data-pt-id]")) {
            if (zoomScale > 1.2) resetZoom();
            else zoomAboutPoint(2.5, e.touches[0].clientX, e.touches[0].clientY);
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;
          touchMode = "pan";
          startTouchX = e.touches[0].clientX;
          startTouchY = e.touches[0].clientY;
          startPanX = panX;
          startPanY = panY;
        }
      }, { passive: true });

      elStage.addEventListener("touchmove", (e) => {
        if (touchMode === "pinch" && e.touches.length === 2) {
          e.preventDefault();
          state.didPan = true;
          const dist = getTouchDist(e.touches[0], e.touches[1]);
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          if (initialPinchDist > 10) {
            zoomAboutPoint(initialPinchScale * (dist / initialPinchDist), midX, midY);
          }
        } else if (touchMode === "pan" && e.touches.length === 1 && zoomScale > 1.01) {
          const dx = e.touches[0].clientX - startTouchX;
          const dy = e.touches[0].clientY - startTouchY;
          if (Math.hypot(dx, dy) > 6) {
            state.didPan = true;
            e.preventDefault();
            panX = startPanX + dx;
            panY = startPanY + dy;
            applyZoomTransform();
          }
        }
      }, { passive: false });

      elStage.addEventListener("touchend", (e) => {
        if (e.touches.length === 0) {
          touchMode = null;
          setTimeout(() => { state.didPan = false; }, 60);
        } else if (e.touches.length === 1) {
          touchMode = "pan";
          startTouchX = e.touches[0].clientX;
          startTouchY = e.touches[0].clientY;
          startPanX = panX;
          startPanY = panY;
        }
      });

      let isMouseDragging = false;
      elStage.addEventListener("mousedown", (e) => {
        if (e.button !== 0 || e.target.closest(".zoom-toolbar")) return;
        isMouseDragging = true;
        state.didPan = false;
        startTouchX = e.clientX;
        startTouchY = e.clientY;
        startPanX = panX;
        startPanY = panY;
        if (zoomScale > 1.01) elStage.classList.add("is-panning");
      });

      window.addEventListener("mousemove", (e) => {
        if (!isMouseDragging || zoomScale <= 1.01) return;
        const dx = e.clientX - startTouchX;
        const dy = e.clientY - startTouchY;
        if (Math.hypot(dx, dy) > 5) {
          state.didPan = true;
          panX = startPanX + dx;
          panY = startPanY + dy;
          applyZoomTransform();
        }
      });

      window.addEventListener("mouseup", () => {
        if (isMouseDragging) {
          isMouseDragging = false;
          elStage.classList.remove("is-panning");
          setTimeout(() => { state.didPan = false; }, 50);
        }
      });

      initSeriesDropdown();
      initSliceQuizState();
      renderAll();
    })();
  </script>
</body>
</html>
